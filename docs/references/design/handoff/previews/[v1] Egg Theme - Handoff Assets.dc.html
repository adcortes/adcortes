<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#1D1E22;color:#D4D4DC;font-family:'Schibsted Grotesk',system-ui,sans-serif}a{color:#FEDA6A}a:hover{color:#D4D4DC}</style>
</helmet>
<div style="max-width:1240px;margin:0 auto;padding:56px clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:48px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <p style="margin:0;font-size:14px;font-weight:500;color:#FEDA6A">Egg Theme · handoff</p>
    <h1 style="margin:0;font-size:34px;font-weight:600;letter-spacing:-0.025em">Hero assets</h1>
  </div>
  <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
    <img src="handoff/assets/hero-landscape.svg" alt="" style="width:100%;aspect-ratio:1600/700;display:block;border:1px solid #393F4D;border-radius:10px">
    <figcaption style="font-size:14px;color:#ADAEB8">hero-landscape.svg — moon + 4 ridge paths in 3 groups, viewBox 0 0 1600 700</figcaption>
  </figure>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px">
    <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
      <img src="handoff/assets/hero-mountains.svg" alt="" style="width:100%;aspect-ratio:1600/700;display:block;border:1px solid #393F4D;border-radius:10px">
      <figcaption style="font-size:14px;color:#ADAEB8">hero-mountains.svg — used on the page</figcaption>
    </figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
      <div style="aspect-ratio:1600/700;border:1px solid #393F4D;border-radius:10px;display:grid;place-items:center">
        <img src="handoff/assets/moon.svg" alt="" style="width:160px;height:160px;display:block">
      </div>
      <figcaption style="font-size:14px;color:#ADAEB8">moon.svg — viewBox 0 0 240 240, disc r 15</figcaption>
    </figure>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;border-top:1px solid #393F4D;padding-top:24px">
    <p style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.015em">Wordmark</p>
    <p style="margin:0;font-size:20px;font-weight:500;letter-spacing:-0.03em">adcortes<span style="color:#FEDA6A">.</span></p>
    <p style="margin:0;font-size:14px;color:#ADAEB8">Live HTML text — Schibsted Grotesk 500, 20px, -0.03em. No SVG needed.</p>
  </div>
</div>
</x-dc>
</body>
</html>
